networks:
  public:
    external: true

secrets:
  nfcmqttbridge_mqtt_password:
    file: ${DIR_CONFIG}/secrets/nfcmqttbridge_mqtt_password

services:
  nfcmqttbridge:
    image: ghcr.io/scottfridwin/nfc-mqtt-bridge:2.0.0
    container_name: nfc-mqtt-bridge
    user: "${UID_NFCREADER}:${GID_SERVICES}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      public:
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD_FILE=/run/secrets/nfcmqttbridge_mqtt_password
      - DEVICE_NAME=${DEVICE_NAME}
      - DEVICE_ID=${DEVICE_ID}
      - LOG_LEVEL=INFO
    secrets:
      - nfcmqttbridge_mqtt_password
    volumes:
      - /run/pcscd:/run/pcscd:rw
    restart: unless-stopped
